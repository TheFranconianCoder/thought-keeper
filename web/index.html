<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the app draws edge to edge and reserves the system bars itself
         (safe-area insets in styles/app.css). Without it the insets are zero and an installed PWA
         whose platform under-applies them — Brave on Android after a reload — loses the bottom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thought Keeper</title>
    <meta name="description" content="A local, agentic knowledge base." />
    <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the reader's colour scheme before the first paint. Without this a stored dark
      // preference is rendered as light for one frame on every launch.
      try {
        const stored = localStorage.getItem('tk-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {
        /* storage can be unavailable; auto still works */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
