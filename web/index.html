<!doctype html>
<html lang="en" data-theme="auto">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Thought Keeper</title>
        <meta name="description" content="A local, agentic knowledge base." />
        <meta name="theme-color" content="#0b0f14" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <script>
            // The theme is applied BEFORE the first paint.
            //
            // The app reads the reader's choice from localStorage, but the bundle runs after the page
            // is parsed — so a stored "dark" on a light system was drawn light first and then jumped to
            // dark: a white flash on every load. Three lines here, before anything is rendered, and the
            // first frame is already the right one. (No stored choice = "auto", which follows the
            // system through the media query in the stylesheet.)
            try {
                const t = localStorage.getItem('tk-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {
                /* a locked-down storage is not a reason to fail the page */
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
