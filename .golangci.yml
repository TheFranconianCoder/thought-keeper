version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - makezero
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-blank: true
      # A close on a reader, a row set or a rolled-back transaction has nothing to report
      # (and nothing to do): the error of the *work* was already handled. `os.Remove` is
      # called on trash moves whose absence is a no-op.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
    govet:
      enable-all: true
      disable:
        - fieldalignment
        # `shadow` is opt-in in the standard tool and flags the idiomatic
        # `if err := f(); err != nil` inside a function that already has an `err`. It is a style
        # heuristic, not a correctness check, and every hit here was a deliberate short declaration.
        - shadow
    staticcheck:
      checks:
        - all
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    rules:
      # Test code: unchecked setup errors and unused params are acceptable.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # sqlc output: generated, not written by hand.
      - path: internal/infrastructure/persistence/sqlc/dal
        linters:
          - errcheck
          - unparam
          - prealloc
